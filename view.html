<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeae1">
  <title>パネパン｜チャレンジ</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    @font-face {
      font-family: "Hanazome";
      src: url("/fonts/hanazome-font.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #f3f0e8;
      --paper: #fbfaf6;
      --beige: #e8e1d5;
      --greige: #b9b3a8;
      --sage: #879b89;
      --sage-dark: #607664;
      --ink: #424841;
      --muted: #85877f;
      --orange: #ed963d;
    }

    body {
      margin: 0;
      padding: 20px 12px 32px;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, #fffdf8 0, transparent 35%),
        var(--ivory);
      color: var(--ink);
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin: 8px 0 16px;
      text-align: center;
      font-size: clamp(20px, 5vw, 28px);
      line-height: 1.4;
      letter-spacing: .04em;
      overflow-wrap: anywhere;
      color: #4d554d;
      font-family: "Hanazome", "Yu Gothic", "Meiryo", sans-serif;
    }

    .status {
      width: fit-content;
      min-width: 110px;
      margin: 12px auto;
      padding: 7px 20px;
      border: 1px solid #d9ded4;
      border-radius: 999px;
      background: rgba(255,255,255,.65);
      color: var(--sage-dark);
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }

    .status.ended {
      color: #a35f51;
      border-color: #e5c9bd;
      background: #f8eee9;
    }

    .progress-text {
      text-align: center;
      margin: 14px 0 9px;
      font-size: 14px;
      font-weight: bold;
      color: #656b61;
    }

    .progress-track {
      height: 12px;
      background: #e3e0d7;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 22px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.05);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #a9bba6, #718d78);
      border-radius: inherit;
      transition: width .35s ease;
    }

    .board {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f9f7f1;
      border: 1px solid #d6d1c6;
      border-radius: 16px;
      box-shadow:
        0 8px 24px rgba(75, 73, 61, .10),
        0 2px 5px rgba(75, 73, 61, .06);
      isolation: isolate;
    }

    /* 立ち絵 */
    .character {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
    }

    .character img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center center;
    }

    /* パネル全体 */
    .panels {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      gap: 2px;
      background: transparent;
    }

    .panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: clamp(3px, 1vw, 8px);
      text-align: center;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: pre-wrap;
      background: transparent;
      color: var(--ink);
      border: 1px solid rgba(107, 111, 98, .22);
      isolation: isolate;
    }

    /* 扉の左右パーツ */
    .door-left,
    .door-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 1;
      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.38),
          transparent 18%,
          transparent 82%,
          rgba(80,78,66,.08)
        ),
        linear-gradient(145deg, #f4f1e8, #e5e1d6);
      border: 1px solid rgba(119, 117, 103, .24);
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .door-left {
      left: 0;
      transform-origin: left center;
      border-right: 1px solid rgba(113, 112, 99, .32);
    }

    .door-right {
      right: 0;
      transform-origin: right center;
      border-left: 1px solid rgba(113, 112, 99, .32);
    }

    /* 扉の控えめな装飾ライン */
    .door-left::after,
    .door-right::after {
      content: "";
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(128, 132, 115, .18);
      border-radius: 3px;
      pointer-events: none;
    }

    .door-left::before,
    .door-right::before {
      content: "";
      position: absolute;
      top: 50%;
      width: 5px;
      height: 5px;
      margin-top: -2.5px;
      border-radius: 50%;
      background: #a6a18f;
      box-shadow: 0 1px 2px rgba(0,0,0,.18);
    }

    .door-left::before {
      right: 7px;
    }

    .door-right::before {
      left: 7px;
    }

    /* パネル内の文字 */
    .panel-item,
    .panel-detail {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .panel-item {
      font-size: clamp(11px, 2.5vw, 17px);
      font-weight: bold;
      line-height: 1.3;
      color: #485249;
    }

    .panel-detail {
      font-size: clamp(9px, 2vw, 14px);
      line-height: 1.35;
      color: #777a70;
    }

    .panel-detail span {
      font-weight: bold;
    }

    /* 扉が開くアニメーション */
    .panel.opening {
      perspective: 700px;
      background: transparent;
    }

    .panel.opening .door-left {
      animation: doorOpenLeft 1.25s cubic-bezier(.22,.7,.25,1) forwards;
    }

    .panel.opening .door-right {
      animation: doorOpenRight 1.25s cubic-bezier(.22,.7,.25,1) forwards;
    }

    @keyframes doorOpenLeft {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(-105deg);
      }
    }

    @keyframes doorOpenRight {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(105deg);
      }
    }

    /* 開いたパネル */
    .panel.open {
      background: transparent;
      border: none;
    }

    .panel.open > * {
      display: none;
    }

    .panel.open .door-left,
    .panel.open .door-right {
      display: none;
    }

    /* 重点パネル */
    .panel.featured {
      z-index: 3;
      border: 4px solid var(--orange);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.85),
        0 0 10px rgba(237,150,61,.55);
    }

    .panel.open.featured {
      border: 4px solid var(--orange);
      background: transparent;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.75),
        0 0 10px rgba(237,150,61,.55);
    }

    /* パネパン透かし：画面全体に斜めの細線と文字を繰り返す */
    .watermark {
      position: absolute;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      opacity: .34;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      background:
        repeating-linear-gradient(
          -35deg,
          transparent 0,
          transparent 34px,
          rgba(255, 255, 255, .48) 35px,
          rgba(255, 255, 255, .48) 36px,
          transparent 37px,
          transparent 72px
        );
    }

    .watermark-label {
      align-self: center;
      justify-self: center;
      color: rgba(255, 255, 255, .88);
      font-size: clamp(10px, 1.9vw, 17px);
      font-weight: 700;
      letter-spacing: .08em;
      white-space: nowrap;
      text-shadow:
        0 1px 2px rgba(45, 50, 42, .42),
        1px 0 1px rgba(45, 50, 42, .18);
      transform: rotate(-35deg);
    }

    .thank-you-message {
      margin: 18px 0 8px;
      padding: 18px 20px;
      border: 1px solid #d9ded4;
      border-radius: 14px;
      background: rgba(255, 255, 255, .72);
      color: #596457;
      font-family: "Hanazome", "Yu Gothic", "Meiryo", sans-serif;
      text-align: center;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .thank-you-title {
      margin: 0 0 8px;
      color: #718675;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: .08em;
    }

    /* 画像保存ボタン */
    .save-image-area {
      margin: 22px 0 8px;
      text-align: center;
    }

    .save-image-button {
      display: inline-block;
      width: 100%;
      max-width: 340px;
      padding: 15px 20px;
      border: 1px solid #718975;
      border-radius: 999px;
      background: linear-gradient(135deg, #8fa38f, #718975);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: .03em;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(83, 108, 87, .20);
      transition: opacity .2s, transform .2s, box-shadow .2s;
    }

    .save-image-button:hover {
      opacity: .92;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(83, 108, 87, .25);
    }

    .save-image-button:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    .save-image-help {
      margin: 9px 0 0;
      color: #888980;
      font-size: 12px;
      line-height: 1.5;
    }

    .message {
      text-align: center;
      padding: 24px 8px;
      line-height: 1.6;
      color: #777a70;
    }

    .hidden {
      display: none !important;
    }

    .update-note {
      margin-top: 12px;
      text-align: center;
      color: #92938b;
      font-size: 11px;
    }

    /* 保存画像用レイアウト */
    .export-card {
      position: fixed;
      left: -12000px;
      top: 0;
      width: 1080px;
      height: 1080px;
      padding: 48px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(circle at 8% 5%, #fffdf7 0, transparent 30%),
        radial-gradient(circle at 95% 95%, #e8ede5 0, transparent 35%),
        #f3f0e8;
      color: #424841;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
    }

    .export-decoration {
      position: absolute;
      color: #aeb9a9;
      font-size: 48px;
      opacity: .35;
      pointer-events: none;
    }

    .export-decoration.top-left {
      top: 22px;
      left: 28px;
    }

    .export-decoration.top-right {
      top: 22px;
      right: 28px;
    }

    .export-decoration.bottom-left {
      bottom: 20px;
      left: 28px;
    }

    .export-decoration.bottom-right {
      bottom: 20px;
      right: 28px;
    }

    .export-title {
      position: relative;
      z-index: 1;
      width: 100%;
      margin: 0 0 12px;
      color: #4d5c50;
      text-align: center;
      font-size: 42px;
      line-height: 1.3;
      font-weight: bold;
      letter-spacing: .04em;
      overflow-wrap: anywhere;
      font-family: "Hanazome", "Yu Gothic", "Meiryo", sans-serif;
    }

    .export-progress-text {
      margin: 0 0 12px;
      color: #718675;
      font-size: 25px;
      font-weight: bold;
      text-align: center;
    }

    .export-progress-track {
      width: 650px;
      height: 18px;
      margin-bottom: 22px;
      overflow: hidden;
      border-radius: 999px;
      background: #dedfd5;
    }

    .export-progress-bar {
      width: 0;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #a9bba6, #718d78);
    }

    .export-board {
      position: relative;
      flex: 0 0 auto;
      width: 850px;
      height: 850px;
      overflow: hidden;
      background: #f9f7f1;
      border: 5px solid #d5d3c8;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(75,73,61,.10);
      isolation: isolate;
    }

    .export-board .panel {
      padding: 8px;
      gap: 6px;
    }

    .export-board .panel-item {
      font-size: 17px;
      line-height: 1.3;
    }

    .export-board .panel-detail {
      font-size: 13px;
      line-height: 1.3;
    }

    .export-board .panel.featured,
    .export-board .panel.open.featured {
      border: 5px solid var(--orange);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.85),
        0 0 12px rgba(237,150,61,.55);
    }

    .export-footer {
      margin-top: auto;
      padding-top: 12px;
      color: #718675;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px 8px 24px;
      }

      h1 {
        margin-bottom: 12px;
      }

      .status {
        font-size: 13px;
      }

      .progress-text {
        font-size: 12px;
      }

      .progress-track {
        margin-bottom: 14px;
        height: 10px;
      }

      .panels {
        gap: 1px;
      }

      .panel {
        gap: 2px;
        padding: 2px;
      }

      .panel-item {
        font-size: clamp(9px, 2.6vw, 13px);
      }

      .panel-detail {
        font-size: clamp(8px, 2vw, 11px);
        line-height: 1.2;
      }

      .panel.featured,
      .panel.open.featured {
        border-width: 3px;
      }

      .thank-you-message {
        margin-top: 14px;
        padding: 15px;
        font-size: 14px;
      }

      .save-image-button {
        font-size: 14px;
      }
    }

    @media (max-width: 350px) {
      .panel {
        gap: 1px;
        padding: 1px;
      }

      .panel-item {
        font-size: 9px;
      }

      .panel-detail {
        font-size: 7px;
      }
    }

    /* 動きを減らす設定の端末ではアニメーションを短縮 */
    @media (prefers-reduced-motion: reduce) {
      .panel.opening .door-left,
      .panel.opening .door-right {
        animation-duration: .01ms;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1 id="challengeTitle">立ち絵チャレンジ</h1>

    <div class="status" id="challengeStatus">
      読み込み中...
    </div>

    <div class="progress-text" id="progressText">
      進捗を読み込み中...
    </div>

    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="board" class="board hidden">
      <div class="character">
        <img id="characterImage" alt="チャレンジの立ち絵">
      </div>

      <div id="panels" class="panels"></div>

      <div id="watermark" class="watermark" aria-hidden="true">
        <span class="watermark-label">パネパンでパネル開け中</span>
        <span class="watermark-label">パネパンでパネル開け中</span>
        <span class="watermark-label">パネパンでパネル開け中</span>
        <span class="watermark-label">パネパンでパネル開け中</span>
        <span class="watermark-label">パネパンでパネル開け中</span>
        <span class="watermark-label">パネパンでパネル開け中</span>
        <span class="watermark-label">パネパンでパネル開け中</span>
        <span class="watermark-label">パネパンでパネル開け中</span>
        <span class="watermark-label">パネパンでパネル開け中</span>
      </div>
    </div>

    <div id="thankYouMessage" class="thank-you-message hidden" aria-live="polite">
      <div class="thank-you-title">THANK YOU</div>
      <div id="thankYouMessageText"></div>
    </div>

    <div id="message" class="message">
      チャレンジ情報を読み込んでいます。
    </div>

    <div id="saveImageArea" class="save-image-area hidden">
      <button
        type="button"
        id="saveImageButton"
        class="save-image-button"
      >
        📷 現在の状態を画像で保存
      </button>
      <p class="save-image-help" id="saveImageHelp">
        現在のチャレンジ状態を画像として保存できます。
      </p>
    </div>

    <div class="update-note" id="updateNote">
      最新のチャレンジ状態を自動更新しています。
    </div>
  </main>

  <!-- 画像保存専用レイアウト -->
  <div id="exportCard" class="export-card" aria-hidden="true">
    <div class="export-decoration top-left">＋</div>
    <div class="export-decoration top-right">◇</div>
    <div class="export-decoration bottom-left">◇</div>
    <div class="export-decoration bottom-right">＋</div>

    <h2 id="exportTitle" class="export-title">
      立ち絵チャレンジ
    </h2>

    <div id="exportProgressText" class="export-progress-text">
      0 / 0 枚オープン（0%）
    </div>

    <div class="export-progress-track">
      <div id="exportProgressBar" class="export-progress-bar"></div>
    </div>

    <div id="exportBoard" class="export-board"></div>

    <div class="export-footer">
      PANE PANE
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const streamerId = params.get("id");

    const titleEl = document.getElementById("challengeTitle");
    const statusEl = document.getElementById("challengeStatus");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const board = document.getElementById("board");
    const panelsEl = document.getElementById("panels");
    const imageEl = document.getElementById("characterImage");
    const watermarkEl = document.getElementById("watermark");
    const thankYouMessageEl = document.getElementById("thankYouMessage");
    const thankYouMessageTextEl = document.getElementById("thankYouMessageText");
    const messageEl = document.getElementById("message");
    const updateNote = document.getElementById("updateNote");

    const saveImageArea = document.getElementById("saveImageArea");
    const saveImageButton = document.getElementById("saveImageButton");
    const saveImageHelp = document.getElementById("saveImageHelp");

    const exportCard = document.getElementById("exportCard");
    const exportTitle = document.getElementById("exportTitle");
    const exportProgressText =
      document.getElementById("exportProgressText");
    const exportProgressBar =
      document.getElementById("exportProgressBar");
    const exportBoard = document.getElementById("exportBoard");

    const UPDATE_INTERVAL = 2000;

    let updateTimer = null;
    let isLoading = false;
    let isFinished = false;
    let currentImageUrl = "";
    let latestChallenge = null;
    let latestPanels = [];

    // パネルの開閉状態を記録し、新しく開いた場合だけ扉を動かす
    let previousOpenStates = new Map();
    let hasInitialPanelState = false;

    function showError(message) {
      board.classList.add("hidden");
      saveImageArea.classList.add("hidden");
      thankYouMessageEl.classList.add("hidden");
      messageEl.textContent = message;
      messageEl.classList.remove("hidden");
      updateNote.classList.add("hidden");
    }

    function setPublicExtras(challenge) {
      // DB値がbooleanでない場合も、初期設定に合わせて透かしをONにする
      const showWatermark =
        typeof challenge.show_watermark === "boolean"
          ? challenge.show_watermark
          : true;

      watermarkEl.classList.toggle("hidden", !showWatermark);

      const thankYouMessage =
        typeof challenge.thank_you_message === "string"
          ? challenge.thank_you_message.trim()
          : "";

      if (challenge.is_ended === true && thankYouMessage) {
        thankYouMessageTextEl.textContent = thankYouMessage;
        thankYouMessageEl.classList.remove("hidden");
      } else {
        thankYouMessageTextEl.textContent = "";
        thankYouMessageEl.classList.add("hidden");
      }
    }

    function setStatus(challenge) {
      statusEl.classList.remove("ended");

      if (challenge.is_ended === true) {
        statusEl.textContent = "チャレンジ終了";
        statusEl.classList.add("ended");
      } else if (challenge.is_started === true) {
        statusEl.textContent = "チャレンジ中";
      } else {
        statusEl.textContent = "開始前";
      }
    }

    function setCharacter(challenge) {
      const imageUrl = challenge.image_url || "";

      if (imageUrl !== currentImageUrl) {
        currentImageUrl = imageUrl;

        if (imageUrl) {
          imageEl.onerror = () => {
            console.error("立ち絵を読み込めませんでした。");
          };

          imageEl.crossOrigin = "anonymous";
          imageEl.src = imageUrl;
        } else {
          imageEl.removeAttribute("src");
        }
      }

      const x = Number(challenge.image_position_x) || 0;
      const y = Number(challenge.image_position_y) || 0;
      const scale = (Number(challenge.image_scale) || 100) / 100;

      imageEl.style.transform =
        `translate(${x}px, ${y}px) scale(${scale})`;
    }

    function createPanel(panel, featuredPanelNumber, animateOpening) {
      const cell = document.createElement("div");
      cell.className = "panel";

      const isFeatured =
        featuredPanelNumber !== null &&
        Number(panel.panel_number) === featuredPanelNumber;

      if (isFeatured) {
        cell.classList.add("featured");
      }

      if (panel.is_open === true && !animateOpening) {
        cell.classList.add("open");
        return cell;
      }

      // 左右の扉
      const leftDoor = document.createElement("div");
      leftDoor.className = "door-left";

      const rightDoor = document.createElement("div");
      rightDoor.className = "door-right";

      if (panel.panel_image_url) {
        leftDoor.classList.add("door-image");
        rightDoor.classList.add("door-image");
        leftDoor.style.backgroundImage = `url("${panel.panel_image_url}")`;
        rightDoor.style.backgroundImage = `url("${panel.panel_image_url}")`;
        leftDoor.style.backgroundSize = "200% 100%";
        rightDoor.style.backgroundSize = "200% 100%";
        leftDoor.style.backgroundPosition = "left center";
        rightDoor.style.backgroundPosition = "right center";
      }

      cell.appendChild(leftDoor);
      cell.appendChild(rightDoor);

      if (animateOpening) {
        cell.classList.add("opening");

        // アニメーション終了後に扉を取り除き、完全に開いた状態にする
        const finishOpening = () => {
          cell.classList.remove("opening");
          cell.classList.add("open");
          leftDoor.remove();
          rightDoor.remove();
          cell.querySelectorAll(
            ".panel-item, .panel-detail"
          ).forEach(el => el.remove());
        };

        rightDoor.addEventListener(
          "animationend",
          finishOpening,
          { once: true }
        );

        // アニメーションイベントが発火しない場合の保険
        setTimeout(() => {
          if (cell.classList.contains("opening")) {
            finishOpening();
          }
        }, 1600);
      }

      if (panel.is_open === true) {
        // 開放済みパネルでは、背景のキャラクター画像を見せる
        return cell;
      }

      const item = document.createElement("div");
      item.className = "panel-item";
      item.textContent = panel.condition_text || "";

      const target = document.createElement("div");
      target.className = "panel-detail";

      const targetLabel = document.createElement("span");
      targetLabel.textContent = "目標：";

      const targetValue = document.createElement("span");
      targetValue.textContent = panel.target_value || "";

      target.appendChild(targetLabel);
      target.appendChild(targetValue);

      const current = document.createElement("div");
      current.className = "panel-detail";

      const currentLabel = document.createElement("span");
      currentLabel.textContent = "あと：";

      const currentValue = document.createElement("span");
      currentValue.textContent = panel.current_value || "";

      current.appendChild(currentLabel);
      current.appendChild(currentValue);

      cell.appendChild(item);
      cell.appendChild(target);
      cell.appendChild(current);

      return cell;
    }
        function renderPanels(
      panels,
      rows,
      columns,
      featuredPanelNumber
    ) {
      panelsEl.style.gridTemplateColumns =
        `repeat(${columns}, minmax(0, 1fr))`;

      panelsEl.style.gridTemplateRows =
        `repeat(${rows}, minmax(0, 1fr))`;

      const fragment = document.createDocumentFragment();
      const nextOpenStates = new Map();

      let openedCount = 0;

      panels.forEach((panel) => {
        const panelNumber = Number(panel.panel_number);
        const isOpen = panel.is_open === true;
        const wasOpen = previousOpenStates.get(panelNumber);

        if (isOpen) {
          openedCount++;
        }

        // 初回読み込み時はアニメーションしない。
        // 2回目以降、閉じた状態から開いた場合だけ再生。
        const animateOpening =
          hasInitialPanelState &&
          isOpen &&
          wasOpen === false;

        nextOpenStates.set(panelNumber, isOpen);

        fragment.appendChild(
          createPanel(
            panel,
            featuredPanelNumber,
            animateOpening
          )
        );
      });

      panelsEl.replaceChildren(fragment);

      previousOpenStates = nextOpenStates;
      hasInitialPanelState = true;

      const total = rows * columns;
      const percent = Math.round((openedCount / total) * 100);

      progressText.textContent =
        `${openedCount} / ${total} 枚オープン（${percent}%）`;

      progressBar.style.width = `${percent}%`;
    }

    function updateExportCard(challenge, panels) {
      const rows = Number(challenge.grid_rows);
      const columns = Number(challenge.grid_columns);

      const openedCount = panels.filter(
        panel => panel.is_open === true
      ).length;

      const total = rows * columns;
      const percent = Math.round((openedCount / total) * 100);

      exportTitle.textContent =
        challenge.title || "立ち絵チャレンジ";

      exportProgressText.textContent =
        `${openedCount} / ${total} 枚オープン（${percent}%）`;

      exportProgressBar.style.width = `${percent}%`;

      const boardClone = board.cloneNode(true);

      boardClone.id = "exportBoardClone";
      boardClone.classList.remove("hidden");
      boardClone.classList.add("export-board");

      boardClone.style.width = "850px";
      boardClone.style.height = "850px";
      boardClone.style.aspectRatio = "1 / 1";

      // 保存画像にも画面と同じ透かし設定を反映
      const exportWatermark = boardClone.querySelector(".watermark");
      const showWatermark =
        typeof challenge.show_watermark === "boolean"
          ? challenge.show_watermark
          : true;

      if (exportWatermark) {
        exportWatermark.classList.toggle("hidden", !showWatermark);
      }

      // 立ち絵の位置・拡大率を保存画像用に調整
      const screenBoardWidth = board.getBoundingClientRect().width;
      const ratio = screenBoardWidth > 0
        ? 850 / screenBoardWidth
        : 1;

      const exportCharacterImage =
        boardClone.querySelector(".character img");

      if (exportCharacterImage) {
        const x = Number(challenge.image_position_x) || 0;
        const y = Number(challenge.image_position_y) || 0;
        const scale = (Number(challenge.image_scale) || 100) / 100;

        exportCharacterImage.style.transform =
          `translate(${x * ratio}px, ${y * ratio}px) scale(${scale})`;
      }

      // APIの開閉状態を基準に保存用パネルを確定する
      const clonedPanels = boardClone.querySelectorAll(".panel");

      clonedPanels.forEach((cell, index) => {
        const panel = panels[index];

        if (!panel) return;

        cell.classList.remove("opening");

        // アニメーションを保存画像に持ち込まない
        cell.querySelectorAll(".door-left, .door-right").forEach(
          door => door.remove()
        );

        if (panel.is_open === true) {
          // 開いているパネルは扉なし
          cell.classList.add("open");
        } else {
          // 閉じているパネルは扉あり
          cell.classList.remove("open");

          const leftDoor = document.createElement("div");
          leftDoor.className = "door-left";

          const rightDoor = document.createElement("div");
          rightDoor.className = "door-right";
          if (panel.panel_image_url) {
            leftDoor.classList.add("door-image");
            rightDoor.classList.add("door-image");
            leftDoor.style.backgroundImage = `url("${panel.panel_image_url}")`;
            rightDoor.style.backgroundImage = `url("${panel.panel_image_url}")`;
            leftDoor.style.backgroundSize = "200% 100%";
            rightDoor.style.backgroundSize = "200% 100%";
            leftDoor.style.backgroundPosition = "left center";
            rightDoor.style.backgroundPosition = "right center";
          }

          cell.prepend(leftDoor, rightDoor);
        }
      });

      exportBoard.replaceChildren(boardClone);
    }

    async function saveCurrentImage() {
      if (saveImageButton.disabled) {
        return;
      }

      if (typeof html2canvas !== "function") {
        alert(
          "画像保存機能を読み込めませんでした。ページを再読み込みしてください。"
        );
        return;
      }

      if (!latestChallenge || !latestPanels.length) {
        alert("チャレンジ情報がまだ読み込まれていません。");
        return;
      }

      saveImageButton.disabled = true;
      saveImageButton.textContent = "画像を作成しています...";

      try {
        // 扉の開閉アニメーション中なら、終了してから保存する
        const waitStart = Date.now();

        while (
          panelsEl.querySelector(".panel.opening") &&
          Date.now() - waitStart < 2000
        ) {
          await new Promise(resolve => setTimeout(resolve, 100));
        }

        // 最新の画面表示を複製する
        updateExportCard(latestChallenge, latestPanels);

        const exportImage =
          exportBoard.querySelector(".character img");

        if (
          exportImage &&
          exportImage.complete === false
        ) {
          await new Promise((resolve) => {
            exportImage.onload = resolve;
            exportImage.onerror = resolve;
          });
        }

        // フォントの読み込み完了を待つ
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        await new Promise(resolve => requestAnimationFrame(resolve));

        const canvas = await html2canvas(exportCard, {
          backgroundColor: "#f3f0e8",
          scale: 1,
          width: 1080,
          height: 1080,
          useCORS: true,
          allowTaint: false,
          logging: false
        });

        const blob = await new Promise((resolve) => {
          canvas.toBlob(resolve, "image/png");
        });

        if (!blob) {
          throw new Error("画像ファイルを作成できませんでした。");
        }

        const imageUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = imageUrl;
        link.download =
          `パネパン_${new Date().toISOString().slice(0, 10)}.png`;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
          URL.revokeObjectURL(imageUrl);
        }, 1000);

        saveImageHelp.textContent =
          "画像を保存しました。ぜひSNSでも共有してください！";

      } catch (error) {
        console.error("画像保存エラー:", error);

        alert(
          "画像を保存できませんでした。立ち絵画像の読み込みや通信状態をご確認ください。"
        );

        saveImageHelp.textContent =
          "画像保存に失敗しました。もう一度お試しください。";

      } finally {
        saveImageButton.disabled = false;
        saveImageButton.textContent =
          "📷 現在の状態を画像で保存";
      }
    }

    async function loadChallenge() {
      if (!streamerId || isLoading || isFinished) {
        return;
      }

      isLoading = true;

      try {
        const response = await fetch(
          "/api/public-challenge?id=" +
            encodeURIComponent(streamerId),
          {
            cache: "no-store",
            headers: {
              "Cache-Control": "no-cache",
            },
          }
        );

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(
            data.error || "チャレンジを読み込めませんでした。"
          );
        }

        const challenge = data.challenge;
        const panels = data.panels || [];

        if (!challenge) {
          throw new Error("チャレンジが見つかりません。");
        }

        const rows = Number(challenge.grid_rows);
        const columns = Number(challenge.grid_columns);

        if (
          !Number.isInteger(rows) ||
          !Number.isInteger(columns) ||
          rows < 3 ||
          rows > 10 ||
          columns < 3 ||
          columns > 10 ||
          panels.length !== rows * columns
        ) {
          throw new Error("パネル情報が正しくありません。");
        }

        latestChallenge = challenge;
        latestPanels = panels;

        const featuredPanelNumber =
          challenge.featured_panel_number == null
            ? null
            : Number(challenge.featured_panel_number);

        titleEl.textContent =
          challenge.title || "立ち絵チャレンジ";

        setCharacter(challenge);

        renderPanels(
          panels,
          rows,
          columns,
          featuredPanelNumber
        );

        setStatus(challenge);
        setPublicExtras(challenge);

        board.classList.remove("hidden");
        messageEl.classList.add("hidden");
        saveImageArea.classList.remove("hidden");
        updateNote.classList.remove("hidden");

        if (challenge.is_ended === true) {
          isFinished = true;
          stopAutoUpdate();
          updateNote.textContent = "チャレンジは終了しました。";
        }

      } catch (error) {
        console.error(error);

        if (board.classList.contains("hidden")) {
          statusEl.textContent = "";
          progressText.textContent = "";
          progressBar.style.width = "0%";

          showError(
            error.message || "読み込みに失敗しました。"
          );
        } else {
          updateNote.textContent =
            "通信を再試行しています...";
        }

      } finally {
        isLoading = false;
      }
    }
        function startAutoUpdate() {
      stopAutoUpdate();

      if (isFinished) {
        return;
      }

      updateTimer = setInterval(() => {
        loadChallenge();
      }, UPDATE_INTERVAL);
    }

    function stopAutoUpdate() {
      if (updateTimer !== null) {
        clearInterval(updateTimer);
        updateTimer = null;
      }
    }

    saveImageButton.addEventListener(
      "click",
      saveCurrentImage
    );

    window.addEventListener("pagehide", stopAutoUpdate);

    if (!streamerId) {
      showError("URLに配信者IDが指定されていません。");
      statusEl.textContent = "";
      progressText.textContent = "";
      progressBar.style.width = "0%";
    } else {
      loadChallenge().then(() => {
        startAutoUpdate();
      });
    }
  </script>
</body>
