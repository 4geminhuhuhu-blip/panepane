
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配信者マイページ</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f6fa;
      color: #263247;
    }

    header {
      background: #263b63;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .welcome {
      margin-bottom: 24px;
    }

    .card {
      background: white;
      padding: 24px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000a;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .status {
      color: #64748b;
      line-height: 1.8;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #263b63;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>配信者マイページ</h1>
  </header>

  <main>
    <section class="welcome">
      <h2>ようこそ！</h2>
      <p>配信者専用ページです。</p>
    </section>

    <section class="card">
      <h2>アカウント情報</h2>
      <p class="status">
        ログイン状態を確認する機能は、これから接続します。
      </p>
    </section>

    <section class="card">
      <h2>配信者メニュー</h2>
      <p>今後、配信情報や各種設定などをここに追加できます。</p>
    </section>
  </main>
</body>
</html>
