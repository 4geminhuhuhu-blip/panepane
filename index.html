
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パネパン｜IRIAMパネル開けシステム</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f3ff;
      color: #292442;
    }

    header {
      background: #6c55c9;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 14px;
    }

    main {
      width: min(92%, 680px);
      margin: 28px auto;
    }

    .card {
      background: white;
      padding: 24px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 16px #29244212;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #6c55c9;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .note {
      color: #716b83;
      font-size: 13px;
      line-height: 1.8;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #716b83;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🎁 パネパン</h1>
    <p>IRIAM パネル開けシステム</p>
  </header>

  <main>
    <section class="card">
      <h2>パネパン</h2>
      <p>
        配信をもっと楽しく！
      </p>
      <p>
        パネル開けについて、画像をアップするだけでできるシステムがあったらいいなと思い、素人が作っています。
      </p>
      <p>
        温かい気持ちで、エラーなどに怒らず使っていただけるとうれしいです。
      </p>
    </section>

    <section class="card" id="login">
      <h2>ライバーログイン</h2>

      <form id="streamer-login-form">
        <label for="login-id">ID</label>
        <input
          id="login-id"
          type="text"
          placeholder="ログインIDを入力"
          autocomplete="username"
          required
        >

        <label for="login-password">PW</label>
        <input
          id="login-password"
          type="password"
          placeholder="パスワードを入力"
          autocomplete="current-password"
          minlength="8"
          required
        >

        <button class="button" type="submit">
          ログイン
        </button>

        <p
          id="login-message"
          class="note"
          role="status"
          aria-live="polite"
        ></p>
      </form>
    </section>

    <section class="card">
      <h2>リスナーの方へ</h2>
      <p>
        配信者から共有された閲覧用URLから参加できます。
      </p>
    </section>
  </main>

  <footer>
    © パネパン｜IRIAM パネル開けシステム
  </footer>

  <script>
    const loginForm = document.getElementById("streamer-login-form");

    if (loginForm) {
      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const message = document.getElementById("login-message");
        const loginId = document.getElementById("login-id").value.trim();
        const password = document.getElementById("login-password").value;
        const submitButton = loginForm.querySelector('button[type="submit"]');

        message.textContent = "ログインを確認しています…";
        submitButton.disabled = true;

        try {
          const response = await fetch("/api/streamer-login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
              login_id: loginId,
              password: password
            })
          });

          const result = await response.json();

          if (!response.ok || !result.ok) {
            message.textContent =
              result.error === "Invalid login ID or password"
                ? "ログインIDまたはパスワードを確認してください。"
                : "ログインできませんでした。時間をおいて再度お試しください。";
            return;
          }

          message.textContent = "ログインしました。次の画面を準備しています。";
          window.location.href = "/streamer.html";

        } catch {
          message.textContent =
            "通信に失敗しました。インターネット接続を確認してください。";

        } finally {
          submitButton.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
